# ──────────────────────────────────────────────
# HRBot — Apache2 Virtual Host (reverse proxy)
# Copiar a /etc/apache2/sites-available/
# ──────────────────────────────────────────────

# Redirigir HTTP → HTTPS
<VirtualHost *:80>
    ServerName hrbot.saargo.com
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName hrbot.saargo.com
    ServerAdmin admin@saargo.com

    # ── SSL (Let's Encrypt / Certbot) ──
    SSLEngine On
    SSLCertificateFile      /etc/letsencrypt/live/hrbot.saargo.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/hrbot.saargo.com/privkey.pem
    SSLProtocol             All -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          HIGH:!aNULL:!MD5:!3DES
    SSLHonorCipherOrder     On

    # ── Reverse Proxy → FastAPI (uvicorn :8080) ──
    ProxyPreserveHost On
    ProxyPass         /  http://127.0.0.1:8080/
    ProxyPassReverse  /  http://127.0.0.1:8080/

    # ── WebSocket (si usas endpoints WS) ──
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade}    websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade   [NC]
    RewriteRule ^/(.*)$            ws://127.0.0.1:8080/$1 [P,L]

    # ── Headers de seguridad ──
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    Header always set X-Content-Type-Options    "nosniff"
    Header always set X-Frame-Options           "DENY"
    Header always set Referrer-Policy           "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"

    # ── Timeouts (evitar cortes en respuestas largas de GPT-4o) ──
    ProxyTimeout 120
    Timeout      120

    # ── Logs ──
    ErrorLog  ${APACHE_LOG_DIR}/hrbot_error.log
    CustomLog ${APACHE_LOG_DIR}/hrbot_access.log combined
</VirtualHost>
